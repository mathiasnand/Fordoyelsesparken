<!DOCTYPE html>
<html lang="no">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Parkatlas – PDF-eksport</title>

	<link rel="stylesheet" href="../../css/fordoyelsesparken.css">

	<style>
		.export-controls {
			position: sticky;
			top: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 14px 20px;
			background: #ffffff;
			border-bottom: 1px solid #d8d2c5;
			font-family: Arial, sans-serif;
		}

		.export-controls button {
			border: 0;
			padding: 10px 16px;
			background: #008f91;
			color: #ffffff;
			font-weight: 700;
			cursor: pointer;
		}

		.export-controls button:disabled {
			cursor: wait;
			opacity: 0.7;
		}

		.export-controls p {
			margin: 0;
			color: #4d5960;
			font-size: 14px;
		}

		#book {
			width: 210mm;
			margin: 20px auto;
		}

		#book>.fp-page {
			margin-bottom: 12mm;
		}

		@media print {
			.export-controls {
				display: none !important;
			}

			body {
				display: block !important;
				padding: 0 !important;
				background: transparent !important;
			}

			#book {
				width: auto !important;
				margin: 0 !important;
			}

			#book>.fp-page {
				margin: 0 !important;
				break-after: page;
				page-break-after: always;
				box-shadow: none !important;
			}

			#book>.fp-page:last-child {
				break-after: auto;
				page-break-after: auto;
			}
		}
	</style>
</head>

<body class="theme-parkatlas">

	<div class="export-controls">
		<button id="print-button" type="button" disabled>Skriver ut …</button>
		<p id="export-status">Laster Parkatlas …</p>
	</div>

	<div id="book"></div>

	<script>
		const pages = [
			"cover.html",
			"001-tittelside.html",
			"002-kolofon.html",
			"003-innholdsfortegnelse.html",
			"004-introduksjon.html",
			"005-slik-brukes-atlaset.html",
			"006-masterplanen.html",
			"007-munnporten-og-parktorget.html",
			"008-parkens-hovedreise.html",
			"009-tannlandet-og-tyggebanen.html",
			"010-spiserorsekspressen.html",
			"011-magesyrefjellet.html",
			"012-enzymlaboratoriet.html",
			"013-tynntarmslabyrinten.html",
			"014-gassgrottene.html",
			"015-tykktarmsstien.html",
			"016-nodutgangen.html",
			"017-kafe-butikker-og-motesteder.html",
			"018-drift-og-sikkerhet.html",
			"019-ansatt-og-serviceruter.html",
			"020-kartsymboler.html",
			"021-skala-og-synsvinkler.html",
			"022-en-park-i-utvikling.html",
			"023-stedsregister.html",
			"024-versjonshistorikk.html",
			"back-cover.html"
		];

		const book = document.getElementById("book");
		const button = document.getElementById("print-button");
		const status = document.getElementById("export-status");

		async function loadBook() {
			try {
				for (let index = 0; index < pages.length; index += 1) {
					const fileName = pages[index];

					status.textContent =
						`Laster side ${index + 1} av ${pages.length}: ${fileName}`;

					const response = await fetch(fileName, {
						cache: "no-store"
					});

					if (!response.ok) {
						throw new Error(`Kunne ikke laste ${fileName}`);
					}

					const source = await response.text();
					const parsed = new DOMParser().parseFromString(
						source,
						"text/html"
					);

					const page = parsed.querySelector(".fp-page, .page");

					if (!page) {
						throw new Error(
							`Fant ingen A4-side i filen: ${fileName}`
						);
					}

					book.appendChild(document.importNode(page, true));
				}

				status.textContent =
					`Parkatlas er klart for PDF-eksport (${pages.length} sider).`;

				button.textContent = "Lagre som PDF";
				button.disabled = false;

			} catch (error) {
				status.textContent =
					"Kunne ikke laste boken. Kontroller filnavnene og åpne filen med Live Server.";

				console.error(error);
			}
		}

		button.addEventListener("click", () => {
			window.print();
		});

		loadBook();
	</script>

</body>

</html>
